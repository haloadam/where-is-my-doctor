name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'tiles/**'
      - 'processed/**'
      - 'web/**'
      - 'scripts/build_site.sh'
      - '.github/workflows/deploy.yml'
  workflow_run:
    workflows: ['Monthly data refresh']
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # When triggered by the data-refresh workflow, only deploy if that run succeeded
    # (push/manual triggers are unaffected).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: bash scripts/build_site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
